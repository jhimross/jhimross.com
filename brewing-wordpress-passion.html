<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <meta name="description" content="I’m a self-proclaimed ‘coffee-loving WordPress nerd’ with a passion for helping others learn WordPress. Currently, I am part of the LevelUp Core Operations Team..." />

  <meta property="og:title" content="Brewing WordPress Passion — Jhimross Olinares" />
  <meta property="og:description" content="I’m a self-proclaimed ‘coffee-loving WordPress nerd’ with a passion for helping others learn WordPress. Currently, I am part of the LevelUp Core Operations Team..." />
  <meta property="og:image" content="http://jhimross.com/wp-content/uploads/2024/04/53701800241_b930f2e7c7_o-1024x683.jpg" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://jhimross.com/brewing-wordpress-passion.html" />
  <meta property="twitter:title" content="Brewing WordPress Passion — Jhimross Olinares" />
  <meta property="twitter:description" content="I’m a self-proclaimed ‘coffee-loving WordPress nerd’ with a passion for helping others learn WordPress. Currently, I am part of the LevelUp Core Operations Team..." />
  <meta property="twitter:image" content="http://jhimross.com/wp-content/uploads/2024/04/53701800241_b930f2e7c7_o-1024x683.jpg" />

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #0b1220;
      --muted: #5b6473;
      --border: #e5e8ee;
      --secondary: #f4f6fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.7;
      margin: 0;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .narrow {
      max-width: 760px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header.nav {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, .8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px;
    }

    .logo {
      display: inline-flex;
      width: 40px;
      height: 40px;
      transition: transform .2s ease;
    }

    .logo:hover {
      transform: scale(1.1);
    }

    .logo svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .nav-links {
      display: none;
      flex-direction: column;
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      background: var(--bg);
      padding: 24px;
      border-bottom: 1px solid var(--border);
      gap: 24px;
      font-size: 16px;
      font-weight: 500;
    }

    .nav-links.active {
      display: flex;
    }

    .nav-links a {
      transition: opacity .2s
    }

    .nav-links a:hover {
      opacity: .6
    }

    .nav-toggle {
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      padding: 4px;
    }

    .nav-toggle span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--fg);
      transition: .3s;
    }

    @media (min-width:768px) {
      .nav-links {
        display: flex;
        flex-direction: row;
        position: static;
        width: auto;
        padding: 0;
        border: none;
        gap: 32px;
        font-size: 14px;
      }

      .nav-toggle {
        display: none;
      }
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: opacity .2s;
    }

    a:hover {
      opacity: .6;
    }

    .post-header {
      padding: 80px 0 48px;
    }

    .post-header h1 {
      font-size: 40px;
      font-weight: 700;
      margin: 0 0 16px;
      letter-spacing: -.02em;
      line-height: 1.2;
    }

    .post-meta {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .post-categories {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .category-tag {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
      font-weight: 700;
      color: var(--muted);
      background: var(--secondary);
      padding: 4px 8px;
      border-radius: 4px;
    }

    .content {
      font-size: 18px;
      color: #1a202c;
      padding-bottom: 80px;
    }

    .content h2,
    .content h3 {
      margin-top: 40px;
      color: var(--fg);
    }

    .content img {
      max-width: 100%;
      border-radius: 12px;
      margin: 32px 0;
    }

    .content p {
      margin-bottom: 24px;
    }

    .content blockquote {
      border-left: 4px solid var(--fg);
      margin: 0;
      padding-left: 24px;
      font-style: italic;
      color: var(--muted);
    }

    .content table {
      width: 100%;
      border-collapse: collapse;
      margin: 32px 0;
    }

    .content th,
    .content td {
      border: 1px solid var(--border);
      padding: 12px 16px;
      text-align: left;
    }

    .content th {
      background: var(--secondary);
      font-weight: 600;
      color: var(--fg);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 40px 0;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 32px;
      font-weight: 500;
      font-size: 14px;
    }

    .yt-embed {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 */
      height: 0;
      margin: 32px 0;
      border-radius: 12px;
      overflow: hidden;
    }

    .yt-embed iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 12px;
    }

    .post-nav {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 32px;
      padding-bottom: 32px;
      margin-top: 64px;
      gap: 24px;
    }

    .nav-prev, .nav-next {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      width: 50%;
    }

    .nav-next {
      text-align: right;
      align-items: flex-end;
    }

    .nav-label {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .nav-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--fg);
    }
  </style>
</head>

<body>
  <header class="nav">
    <div class="container nav-inner">
      <a href="/" class="logo" aria-label="Home">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <rect x="5" y="5" width="90" height="90" fill="none" stroke="currentColor" stroke-width="4" />
          <path d="M42 28V62C42 68 38 72 30 72" fill="none" stroke="currentColor" stroke-width="12"
            stroke-linecap="square" />
          <rect x="60" y="28" width="22" height="7" fill="currentColor" />
          <circle cx="71" cy="62" r="9" fill="currentColor" />
        </svg>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html#about">About</a>
        <a href="index.html#work">Work</a>
        <a href="blog.html">Journal</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="nav-toggle" id="navToggle">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </header>

  <article class="narrow">
    <div class="post-header">
      <a href="blog.html" class="back">← Back to Journal</a>
      <h1 id="postTitle">Loading...</h1>
      <div id="postCategories" class="post-categories"></div>
      <div id="postMeta" class="post-meta"></div>
    </div>

    <div id="postContent" class="content">
      <!-- Markdown will be rendered here -->
    </div>

    <div id="postNav" class="post-nav">
      <a id="prevPost" href="#" class="nav-prev" style="display: none;">
        <span class="nav-label">← Previous</span>
        <span class="nav-title"></span>
      </a>
      <a id="nextPost" href="#" class="nav-next" style="display: none;">
        <span class="nav-label">Next →</span>
        <span class="nav-title"></span>
      </a>
    </div>
  </article>

  <footer>
    <div class="container">© <span id="y"></span> Jhimross Olinares</div>
  </footer>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();

    const navToggle = document.getElementById('navToggle');
    const navLinks = document.getElementById('navLinks');

    navToggle.addEventListener('click', () => {
      navLinks.classList.toggle('active');
    });

    // Close menu when clicking a link
    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        navLinks.classList.remove('active');
      });
    });

    const params = new URLSearchParams(window.location.search);
    const slug = "brewing-wordpress-passion";

    if (slug) {
      fetch(`posts/${slug}.md`)
        .then(response => {
          if (!response.ok) throw new Error(`Could not find post: ${slug}`);
          return response.text();
        })
        .then(text => {
          // Extract frontmatter
          const parts = text.split('---');
          if (parts.length >= 3) {
            const fm = parts[1];
            const content = parts.slice(2).join('---');

            // More robust parsing
            const lines = fm.split('\n');
            let title = "";
            let date = "";
            let categories = [];

            lines.forEach(line => {
              if (line.startsWith('title:')) {
                let rawTitle = line.replace('title:', '').trim();
                if (rawTitle.startsWith('"')) {
                  try {
                    title = JSON.parse(rawTitle);
                  } catch (e) {
                    title = rawTitle.replace(/^"|"$/g, '');
                  }
                } else {
                  title = rawTitle;
                }
              }
              if (line.startsWith('date:')) {
                date = line.replace('date:', '').trim().split(' ')[0];
              }
              if (line.startsWith('categories:')) {
                let catText = line.replace('categories:', '').trim();
                try {
                  // Try to parse as array
                  const cleaned = catText.replace(/'/g, '"');
                  const cats = JSON.parse(cleaned);
                  if (Array.isArray(cats)) categories = cats;
                } catch (e) {
                  // Fallback for simple comma separated
                  categories = catText.split(',').map(c => c.trim().replace(/^["']|["']$/g, ''));
                }
              }
            });

            if (!title) title = "Untitled Post";

            document.title = `${title} — Jhimross Olinares`;
            document.getElementById('postTitle').textContent = title;
            document.getElementById('postMeta').textContent = date ? `Published on ${date}` : "";

            const catsList = document.getElementById('postCategories');
            if (categories.length > 0) {
              catsList.innerHTML = categories.map(c => `<span class="category-tag">${c}</span>`).join('');
            } else {
              catsList.innerHTML = '';
            }

            if (typeof marked !== 'undefined') {
              document.getElementById('postContent').innerHTML = marked.parse(content);
            } else {
              document.getElementById('postContent').innerHTML = `<pre>${content}</pre>`;
              console.warn('Marked library not loaded');
            }

            // Load posts.json for next/prev navigation
            fetch('posts/posts.json')
              .then(res => {
                if (!res.ok) throw new Error('Could not load posts.json');
                return res.json();
              })
              .then(posts => {
                const currentIndex = posts.findIndex(p => p.slug === slug);
                if (currentIndex !== -1) {
                  // posts are sorted by date descending (newest first)
                  // Next post chronologically is newer (index - 1)
                  // Previous post chronologically is older (index + 1)
                  const nextPost = currentIndex > 0 ? posts[currentIndex - 1] : null;
                  const prevPost = currentIndex < posts.length - 1 ? posts[currentIndex + 1] : null;

                  const prevLink = document.getElementById('prevPost');
                  const nextLink = document.getElementById('nextPost');

                  if (prevPost) {
                    prevLink.href = `${prevPost.slug}.html`;
                    prevLink.querySelector('.nav-title').textContent = prevPost.title;
                    prevLink.style.display = 'flex';
                  }

                  if (nextPost) {
                    nextLink.href = `${nextPost.slug}.html`;
                    nextLink.querySelector('.nav-title').textContent = nextPost.title;
                    nextLink.style.display = 'flex';
                  }
                }
              })
              .catch(err => console.error('Error loading navigation:', err));

          } else {
            throw new Error('Invalid post format');
          }
        })
        .catch(err => {
          console.error('Error loading post:', err);
          document.getElementById('postTitle').textContent = "Error";
          document.getElementById('postContent').innerHTML = `<p style="color: red;">${err.message}</p>`;
        });
    } else {
      document.getElementById('postTitle').textContent = "Post Not Found";
      document.getElementById('postContent').innerHTML = '<p>No post specified.</p>';
    }
  </script>
</body>

</html>
